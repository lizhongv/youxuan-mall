# 持续集成：每次推送与 PR 运行服务端单元测试并构建两个前端，保证主干随时可发布。
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  server:
    name: 服务端单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 运行单元测试并打包
        run: ./mvnw -B -pl mall-server -am package
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: mall-server/target/surefire-reports

  web:
    name: 前端构建（${{ matrix.app }}）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [mall-admin, mall-h5]
    defaults:
      run:
        working-directory: web/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      # 仓库的 .npmrc 指向国内镜像，CI 在海外机房改用官方源更快
      - name: 安装依赖
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: 类型检查与构建
        run: npm run build
