#################################################
######### canal example instance ################
#################################################

canal.instance.gtidon = false

# 连接 Windows 上的 MySQL（WSL 容器看 Windows host）
# WSL2 容器看 Windows host 的真实 IP（每台机器可能不同；用 ipconfig 看 vEthernet (WSL) 的 IPv4）
canal.instance.master.address = 172.22.80.1:3306
canal.instance.master.journal.name =
canal.instance.master.position =
canal.instance.master.timestamp =
canal.instance.master.gtid =

canal.instance.rds.accesskey =
canal.instance.rds.secretkey =
canal.instance.rds.instanceId =

canal.instance.tsdb.enable = true

canal.instance.dbUsername = canal
canal.instance.dbPassword = canal
canal.instance.connectionCharset = UTF-8
canal.instance.enableDruid = false
canal.instance.defaultDatabaseName = platform_cloud

# 只关心 goods 相关表
canal.instance.filter.regex = platform_cloud\\.goods,platform_cloud\\.goods_sku,platform_cloud\\.goods_category,platform_cloud\\.goods_brand
canal.instance.filter.black.regex = mysql\\..*,information_schema\\..*,performance_schema\\..*,sys\\..*

# RocketMQ topic 配置：所有库表的 binlog 都发到 canal_goods topic
canal.mq.topic = canal_goods
canal.mq.partition = 0
canal.mq.dynamicTopic =
canal.mq.partitionsNum =
canal.mq.partitionHash =
