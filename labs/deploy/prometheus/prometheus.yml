global:
  scrape_interval: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["172.22.80.1:8888"]
        labels: { app: gateway, env: dev }

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["172.22.80.1:8081"]
        labels: { app: auth-service, env: dev }

  - job_name: goods-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["172.22.80.1:8082"]
        labels: { app: goods-service, env: dev }

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["172.22.80.1:8083"]
        labels: { app: order-service, env: dev }
