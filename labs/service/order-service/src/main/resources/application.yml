server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    # 切到 ShardingSphere 驱动；订单按 user_id 路由到 orders_0/orders_1
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding-config.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  flyway:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# RocketMQ Producer
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: order-service-producer
    send-message-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

knife4j:
  enable: true
  setting:
    language: zh_cn

platform:
  jwt:
    secret: ${PLATFORM_JWT_SECRET:platform-cloud-dev-jwt-hs256-secret-do-not-use-in-prod-32bytes-min}
    access-ttl: PT30M
    refresh-ttl: P7D
    issuer: platform-cloud

# Seata：Phase 3.3 演示分片时暂关，避免 ShardingSphere DataSource 与 Seata DataSourceProxy 双层包装
# Phase 3 后单独做"Seata + ShardingSphere 协同"专题再开
seata:
  enabled: false
  application-id: ${spring.application.name}
  tx-service-group: default_tx_group
  enable-auto-data-source-proxy: false
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: ${SEATA_TC:127.0.0.1:8091}
  registry:
    type: file
  config:
    type: file
  client:
    rm:
      report-success-enable: true
