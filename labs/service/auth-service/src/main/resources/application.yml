server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  profiles:
    active: dev
  # auth-service 不连 DB，排除自动装配
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

platform:
  jwt:
    secret: ${PLATFORM_JWT_SECRET:platform-cloud-dev-jwt-hs256-secret-do-not-use-in-prod-32bytes-min}
    access-ttl: PT30M
    refresh-ttl: P7D
    issuer: platform-cloud
