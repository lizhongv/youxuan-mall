server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:platform_cloud}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:12345678}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
  # Flyway 由 bootstrap-app 主导（已迁移到 V2），独立启动 goods-service 时无需再跑
  flyway:
    enabled: false
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    socket-timeout: 5s
    connection-timeout: 3s

# Canal TCP Pull
canal:
  host: ${CANAL_HOST:localhost}
  port: ${CANAL_PORT:11111}
  destination: example
  # 单反斜杠：YAML 里原样给 canal-client 编译为正则 `\.`（字面点）
  subscribe: 'platform_cloud\.goods.*'

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT：goods-service 仅校验 token，需与 auth-service 用同一密钥
platform:
  jwt:
    secret: ${PLATFORM_JWT_SECRET:platform-cloud-dev-jwt-hs256-secret-do-not-use-in-prod-32bytes-min}
    access-ttl: PT30M
    refresh-ttl: P7D
    issuer: platform-cloud

# OpenFeign：开启 CircuitBreaker，让 fallbackFactory 生效
spring.cloud.openfeign.circuitbreaker.enabled: true
spring.cloud.openfeign.circuitbreaker.alphanumeric-ids.enabled: true

# Resilience4j 默认 TimeLimiter 1s 太苛刻；放宽到 5s，否则健康调用也超时
resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: false
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s

# Sentinel：dashboard 暂不启动，仍可本地用代码内置规则限流
spring.cloud.sentinel:
  transport:
    dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
    port: 8719
  eager: true                       # 启动即创建客户端连接，避免首次 cold start
  log:
    dir: ./logs/sentinel

# RocketMQ Consumer
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  consumer:
    group: goods-service-consumer

# Seata：与 order-service 必须用同一 tx-service-group + TC
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: default_tx_group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: ${SEATA_TC:127.0.0.1:8091}
  registry:
    type: file
  config:
    type: file
