# platform-cloud 本地依赖一键启动
# 使用 docker-compose profiles 按需启动；默认 (--profile core) 仅启 MySQL/Redis/Nacos
#
# 用法：
#   核心三件套（Phase 1 必备）:        docker compose --profile core up -d
#   加 RocketMQ（Phase 2 用）:         docker compose --profile core --profile mq up -d
#   加 ES + Kibana（Phase 3 用）:      docker compose --profile core --profile search up -d
#   加可观测性栈（Phase 5 用）:        docker compose --profile observability up -d
#   全开:                              docker compose --profile core --profile mq --profile search --profile observability up -d
#   停止全部:                          docker compose --profile "*" down

name: platform-cloud

networks:
  platform-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
  es-data:
  prom-data:
  grafana-data:

services:
  # ==================== Phase 1：核心三件套 ====================
  mysql:
    image: mysql:8.4
    container_name: platform-mysql
    profiles: ["core"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-platform123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-platform_cloud}
      MYSQL_USER: ${MYSQL_USER:-platform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-platform123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=1000
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [platform-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: platform-redis
    profiles: ["core"]
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-platform123}
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks: [platform-net]

  nacos:
    image: nacos/nacos-server:v2.4.3-slim
    container_name: platform-nacos
    profiles: ["core"]
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey0123456789012345678901234567890123456789012345678901}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-nacos}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-nacos}
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    networks: [platform-net]

  # ==================== Phase 2：消息中间件 ====================
  rmqnamesrv:
    image: apache/rocketmq:5.3.1
    container_name: platform-rmqnamesrv
    profiles: ["mq"]
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Xmn256m"
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    networks: [platform-net]

  rmqbroker:
    image: apache/rocketmq:5.3.1
    container_name: platform-rmqbroker
    profiles: ["mq"]
    restart: unless-stopped
    depends_on: [rmqnamesrv]
    command: sh mqbroker -n rmqnamesrv:9876 -c /home/rocketmq/conf/broker.conf --enable-proxy
    environment:
      NAMESRV_ADDR: rmqnamesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx1g -Xmn256m"
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
      - "8081:8081" # Proxy gRPC
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store
    networks: [platform-net]

  rmqdashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: platform-rmqdashboard
    profiles: ["mq"]
    restart: unless-stopped
    depends_on: [rmqnamesrv]
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rmqnamesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    ports:
      - "18080:8080"
    networks: [platform-net]

  # ==================== Phase 3：搜索 ====================
  elasticsearch:
    image: elasticsearch:8.15.3
    container_name: platform-es
    profiles: ["search"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [platform-net]
    ulimits:
      memlock:
        soft: -1
        hard: -1

  kibana:
    image: kibana:8.15.3
    container_name: platform-kibana
    profiles: ["search"]
    restart: unless-stopped
    depends_on: [elasticsearch]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      I18N_LOCALE: zh-CN
    ports:
      - "5601:5601"
    networks: [platform-net]

  # ==================== Phase 5：可观测性 ====================
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: platform-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prom-data:/prometheus
    networks: [platform-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: platform-grafana
    profiles: ["observability"]
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-platform123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [platform-net]

  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: platform-skywalking-oap
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      SW_STORAGE: h2
      SW_HEALTH_CHECKER: default
      SW_TELEMETRY: prometheus
      JAVA_OPTS: "-Xms512m -Xmx1g"
    ports:
      - "11800:11800" # gRPC，Agent 上报
      - "12800:12800" # HTTP
    networks: [platform-net]

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: platform-skywalking-ui
    profiles: ["observability"]
    restart: unless-stopped
    depends_on: [skywalking-oap]
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - "8088:8080"
    networks: [platform-net]
