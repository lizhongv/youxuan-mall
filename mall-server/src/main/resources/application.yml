# 商城服务端配置。环境相关的值全部来自环境变量。
# 运行模式 MALL_PROFILE：prod（默认，真实营业）/ demo（演示、本机开发）。
#   prod 下模拟支付、验证码回显、接口文档被强制关闭，密钥为默认值时拒绝启动，见 MallProfileEnvironmentPostProcessor；
#   本机开发请设置 MALL_PROFILE=demo，demo 专属默认值在 application-demo.yml。
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: mall-server
  profiles:
    active: ${MALL_PROFILE:prod}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:mall}
    password: ${MYSQL_PASSWORD:mall123}
    hikari:
      # 单机部署：20 个连接足以支撑数百 QPS，过大反而增加 MySQL 上下文切换
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

knife4j:
  enable: true
  # prod 模式强制为 true（屏蔽 /doc.html），demo 模式默认开放
  production: ${KNIFE4J_PRODUCTION:false}
  setting:
    language: zh_cn

springdoc:
  # prod 模式强制关闭 /v3/api-docs 与 swagger-ui：接口清单是攻击者最好的地图
  api-docs:
    enabled: true
  group-configs:
    - group: admin
      display-name: 管理端
      paths-to-match: /admin/**
    - group: app
      display-name: 商城端
      paths-to-match: /app/**

platform:
  jwt:
    # 必须通过 MALL_JWT_SECRET 注入随机密钥（≥ 32 字节）；不提供默认值，prod 下缺失或为占位值时拒绝启动
    secret: ${MALL_JWT_SECRET:}
    access-ttl: ${MALL_JWT_ACCESS_TTL:PT2H}
    refresh-ttl: P7D
    issuer: mall-server

mall:
  # 仅首次建库时创建 admin 使用；admin 首次登录后被强制修改密码
  init-admin-password: ${MALL_INIT_ADMIN_PASSWORD:admin123}
  security:
    force-change-initial-password: ${MALL_FORCE_CHANGE_INITIAL_PASSWORD:true}
    captcha-echo: false
    login-ip-per-minute: ${MALL_LOGIN_IP_PER_MINUTE:20}
  sms:
    # 验证码回显（devCode），仅 demo 模式可开；prod 强制 false
    dev-mode: ${MALL_SMS_DEV_MODE:false}
    # 同一 IP 每小时、全站每分钟的发送上限：图形验证码之外再兜一层，防止被刷短信费
    ip-hourly-limit: ${MALL_SMS_IP_HOURLY_LIMIT:20}
    global-per-minute-limit: ${MALL_SMS_GLOBAL_PER_MINUTE_LIMIT:60}
  upload:
    dir: ${MALL_UPLOAD_DIR:./data/uploads}
    url-prefix: ${MALL_UPLOAD_URL_PREFIX:/uploads}
  pay:
    # 模拟支付（立即成功），仅 demo 模式可开；prod 模式强制 false，否则任何人都能「零元购」
    mock-enabled: ${MALL_PAY_MOCK_ENABLED:false}

logging:
  level:
    com.platform.cloud: info
