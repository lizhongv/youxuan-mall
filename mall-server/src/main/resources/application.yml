# 商城服务端配置。环境相关的值全部来自环境变量，默认值只适用于本机开发。
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: mall-server
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:mall}
    password: ${MYSQL_PASSWORD:mall123}
    hikari:
      # 单机部署：20 个连接足以支撑数百 QPS，过大反而增加 MySQL 上下文切换
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

knife4j:
  enable: true
  # 生产环境可设 KNIFE4J_PRODUCTION=true 关闭文档
  production: ${KNIFE4J_PRODUCTION:false}
  setting:
    language: zh_cn

springdoc:
  group-configs:
    - group: admin
      display-name: 管理端
      paths-to-match: /admin/**
    - group: app
      display-name: 商城端
      paths-to-match: /app/**

platform:
  jwt:
    # 生产环境务必通过 MALL_JWT_SECRET 注入随机密钥（≥ 32 字节）
    secret: ${MALL_JWT_SECRET:mall-dev-only-jwt-secret-please-change-in-production-32b}
    access-ttl: ${MALL_JWT_ACCESS_TTL:PT2H}
    refresh-ttl: P7D
    issuer: mall-server

mall:
  init-admin-password: ${MALL_INIT_ADMIN_PASSWORD:admin123}
  upload:
    dir: ${MALL_UPLOAD_DIR:./data/uploads}
    url-prefix: ${MALL_UPLOAD_URL_PREFIX:/uploads}

logging:
  level:
    com.platform.cloud: info
