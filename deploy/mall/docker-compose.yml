# 商城一键部署：MySQL + Redis + 服务端 + Nginx（托管两个前端、上传文件并反向代理接口）
# 用法：cp .env.example .env 修改密码后 docker compose up -d；目录结构见 deploy/mall/README.md
name: mall

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mall
      MYSQL_USER: mall
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 单机小内存环境：缓冲池 256MB 足够演示与中小店铺，避免挤占其他服务
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # 只绑本机回环，排查数据时用；不对局域网开放
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 192M

  server:
    # 直接用 JRE 镜像运行挂载进来的 jar：发版只替换 jar，不需要在服务器上构建镜像
    image: eclipse-temurin:17-jre-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "exec java $$JAVA_OPTS -jar /app/mall-server.jar"]
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 运行模式：prod（默认，真实营业）/ demo（演示）。prod 下演示开关被强制关闭，密钥为默认值时拒绝启动
      MALL_PROFILE: ${MALL_PROFILE:-prod}
      MALL_JWT_SECRET: ${MALL_JWT_SECRET}
      MALL_INIT_ADMIN_PASSWORD: ${MALL_INIT_ADMIN_PASSWORD}
      # 以下两项只在 demo 模式生效，prod 模式下无论取值都被强制为 false；demo 演示机需在 .env 中设为 true
      MALL_SMS_DEV_MODE: ${MALL_SMS_DEV_MODE:-false}
      MALL_PAY_MOCK_ENABLED: ${MALL_PAY_MOCK_ENABLED:-false}
      MALL_UPLOAD_DIR: /app/uploads
      LOG_PATH: /app/logs
    volumes:
      - ./app/mall-server.jar:/app/mall-server.jar:ro
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 768M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8090}:80"
    volumes:
      - ./nginx/mall.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/h5:/usr/share/nginx/h5:ro
      - ./web/console:/usr/share/nginx/console:ro
      - ./data/uploads:/usr/share/nginx/uploads:ro
    depends_on:
      - server

volumes:
  mysql-data:
  redis-data:
