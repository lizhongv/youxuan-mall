# 同一端口提供：/ 移动商城、/console/ 管理后台、/api/ 后端接口、/uploads/ 上传文件
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 接口：去掉 /api 前缀转发，保留真实 IP 供登录日志与限流使用
    location /api/ {
        proxy_pass http://server:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 接口文档（Knife4j）
    location ~ ^/(doc\.html|webjars/|v3/api-docs|swagger-resources) {
        proxy_pass http://server:8081;
        proxy_set_header Host $host;
    }

    # 上传文件：Nginx 直接读磁盘，不经过 Java
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 管理后台（history 路由回退到 index.html）
    location /console/ {
        alias /usr/share/nginx/console/;
        try_files $uri $uri/ /console/index.html;
    }
    location = /console {
        return 301 /console/;
    }

    # 带 hash 的静态资源长缓存；index.html 不缓存，保证发版后立即生效
    location /console/assets/ {
        alias /usr/share/nginx/console/assets/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        root /usr/share/nginx/h5;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/h5;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
