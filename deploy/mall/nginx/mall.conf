# 同一端口提供：/ 移动商城、/console/ 管理后台、/api/ 后端接口、/uploads/ 上传文件
#
# 认证接口限流（按客户端 IP）：在应用层「账号 + IP 失败锁定 / 图形验证码 / 短信频控」之前先挡掉突发流量，
# 爆破脚本打不到 Java 进程。本文件被 include 在 http 块内，limit_req_zone 只能写在 server 之外。
#   mall_auth  ：/api/admin/auth/、/api/app/auth/ 整体，5 次/秒、突发 20（me、refresh、captcha 也在这里，留足余量）
#   mall_login ：登录、发短信、注册、重置密码，30 次/分钟、突发 10
limit_req_zone $binary_remote_addr zone=mall_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=mall_login:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 登录、发短信等高价值接口：更严格的限流（正则 location 优先于下面的前缀 location）
    location ~ ^/api/(admin/auth/login|app/auth/(login|login-sms|register|sms-code|reset-password))$ {
        limit_req zone=mall_login burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://server:8081;
        proxy_set_header Host $host;
        # X-Real-IP 由这里覆盖为真实连接地址，客户端自带的同名头无效；后端只信任该头
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/admin/auth/ {
        limit_req zone=mall_auth burst=20 nodelay;
        proxy_pass http://server:8081/admin/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/app/auth/ {
        limit_req zone=mall_auth burst=20 nodelay;
        proxy_pass http://server:8081/app/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 接口：去掉 /api 前缀转发；X-Real-IP 供登录日志与限流使用（后端不读 X-Forwarded-For）
    location /api/ {
        proxy_pass http://server:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 接口文档（Knife4j）：location 保留，prod 模式下后端已关闭文档，这里只会得到 404 / 401；demo 模式正常可用
    location ~ ^/(doc\.html|webjars/|v3/api-docs|swagger-resources) {
        proxy_pass http://server:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 上传文件：Nginx 直接读磁盘，不经过 Java。
    # nosniff + 最严格的 CSP：即使有人绕过文件头校验上传了 HTML / SVG，浏览器也不会执行其中的脚本
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
    }

    # 管理后台（history 路由回退到 index.html）
    # 安全头：禁止被其他站点嵌入 iframe（点击劫持）、跨站只带源站 Referer、禁止 MIME 嗅探
    location /console/ {
        alias /usr/share/nginx/console/;
        try_files $uri $uri/ /console/index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /console {
        return 301 /console/;
    }

    # 带 hash 的静态资源长缓存；index.html 不缓存，保证发版后立即生效
    location /console/assets/ {
        alias /usr/share/nginx/console/assets/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /assets/ {
        root /usr/share/nginx/h5;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        root /usr/share/nginx/h5;
        try_files $uri $uri/ /index.html;
        # 注意：location 内写了 add_header 就不会继承 server 级的，因此每个 location 单独列出
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
