# RocketMQ Broker config for local dev
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 让宿主机的 producer/consumer 能访问到 broker
# Windows 应用通过 localhost 经 WSL2 转发到 broker 容器
brokerIP1 = 127.0.0.1
namesrvAddr = rmqnamesrv:9876
# 自动创建 topic（dev only；生产环境务必关闭）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
